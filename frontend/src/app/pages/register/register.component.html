<section class="register-shell" [class.validation-visible]="submitted && !formularioValido()">
  <div class="register-toast" *ngIf="error" role="alert" aria-live="assertive">
    <span class="toast-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg></span>
    <span class="toast-copy"><strong>Error</strong><span>{{ error }}</span></span>
    <button type="button" class="toast-close" aria-label="Cerrar aviso" (click)="clearError()">×</button>
  </div>
  <div class="register-card">
    <h1>Crear cuenta</h1>
    <p>Registra un nuevo usuario</p>

    <form (ngSubmit)="onSubmit()" novalidate>
      <label>
        Nombre
        <input type="text" [(ngModel)]="nombre" name="nombre" autocomplete="name" [class.invalid]="submitted && !nombreValido()" />
        <span class="field-error" *ngIf="submitted && !nombre.trim()">Escribe tu nombre y apellido.</span>
        <span class="field-error" *ngIf="submitted && nombre.trim() && !nombreValido()">Ingresa al menos un nombre y un apellido, usando solo letras.</span>
      </label>

      <label>
        Correo
        <input type="email" [(ngModel)]="correo" name="correo" autocomplete="email" [class.invalid]="submitted && !correoValido()" />
        <span class="field-error" *ngIf="submitted && !correo.trim()">Escribe tu correo electrónico.</span>
        <span class="field-error" *ngIf="submitted && correo.trim() && !correoValido()">Ingresa un correo electrónico válido.</span>
      </label>

      <label>
        Teléfono
        <input type="text" [(ngModel)]="telefono" (input)="formatearTelefono()" name="telefono" inputmode="numeric" autocomplete="tel" placeholder="7777-7777" maxlength="9" [class.invalid]="submitted && !telefonoValido()" />
        <span class="field-error" *ngIf="submitted && !telefono.trim()">Escribe tu número de teléfono.</span>
        <span class="field-error" *ngIf="submitted && telefono.trim() && !telefonoValido()">Usa el formato 7777-7777.</span>
      </label>

      <label>
        Usuario
        <input type="text" [(ngModel)]="username" name="username" autocomplete="username" [class.invalid]="submitted && !username.trim()" />
        <span class="field-error" *ngIf="submitted && !username.trim()">Elige un nombre de usuario.</span>
      </label>

      <label>
        Contraseña
        <span class="password-input-wrap">
          <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" autocomplete="new-password" [class.invalid]="submitted && password.length < 8" />
          <button class="password-toggle" type="button" (click)="mostrarPassword = !mostrarPassword" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="mostrarPassword" [title]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.4 3.8-1"/></svg>
          </button>
        </span>
        <span class="field-error" *ngIf="submitted && !password">Crea una contraseña para tu cuenta.</span>
        <span class="field-error" *ngIf="submitted && password && password.length < 8">La contraseña debe tener al menos 8 caracteres.</span>
      </label>

      <button type="submit">Registrarse</button>
    </form>

    <p class="success" *ngIf="success">{{ success }}</p>
    <p class="link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</section>
