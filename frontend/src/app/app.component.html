<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <section class="calendar-reminder-toast" *ngIf="calendarReminder" role="alert" aria-live="assertive">
    <span class="calendar-reminder-icon" aria-hidden="true">{{ calendarReminder.payment ? '▣' : '◷' }}</span>
    <button type="button" class="calendar-reminder-copy" (click)="openCalendarReminder()">
      <strong>{{ calendarReminder.payment ? 'Recordatorio de pago' : 'Actividad programada' }}</strong>
      <span>{{ calendarReminder.title }} · {{ calendarReminderTime(calendarReminder.date) }}</span>
    </button>
    <button type="button" class="calendar-reminder-close" (click)="closeCalendarReminder()" aria-label="Cerrar recordatorio">×</button>
  </section>
  <aside class="sidebar drawer" [class.open]="sidebarOpen" *ngIf="showSidebar">
    <button class="drawer-close" *ngIf="sidebarOpen" (click)="closeSidebarOverlay()" aria-label="Cerrar menú lateral">
      ✕
    </button>
    <div class="brand">
      <div class="brand-logo">
        <img src="assets/logo.png" alt="Logo Control Financiero" />
      </div>
      <div class="brand-text">
        <h2>Control Financiero</h2>
        <p>Gestión de finanzas</p>
      </div>
    </div>

    <nav class="nav-links" #navLinks>
      <section class="nav-group" *ngFor="let section of menuSections">
        <h3 class="nav-group-title">{{ section.titulo }}</h3>
        <a *ngFor="let option of section.opciones" [routerLink]="option.ruta" routerLinkActive="active" [title]="option.etiqueta">
          <span class="nav-icon" [ngSwitch]="option.icono">
            <span *ngSwitchCase="'dashboard'" class="menu-asset-icon dashboard-icon" aria-hidden="true"></span>
            <span *ngSwitchCase="'cuentas'" class="account-icon" aria-hidden="true"></span>
            <span *ngSwitchCase="'movimientos'" class="menu-asset-icon movimientos-icon" aria-hidden="true"></span>
            <span *ngSwitchCase="'calendario'" class="menu-asset-icon calendario-icon" aria-hidden="true"></span>
            <span *ngSwitchCase="'usuarios'" class="menu-asset-icon usuarios-icon" aria-hidden="true"></span>
            <span *ngSwitchCase="'configuracion'" class="menu-asset-icon configuracion-icon" aria-hidden="true"></span>
            <span *ngSwitchCase="'reporte'" class="report-icon" aria-hidden="true"></span>
          </span>
          <span class="nav-label">{{ option.etiqueta }}</span>
        </a>
      </section>

      <div class="sidebar-toggle-wrapper" #toggleWrapper>
        <button
          type="button"
          class="sidebar-toggle-btn"
          *ngIf="isAuthenticated"
          (click)="onToggleButtonClick($event)"
          [attr.aria-expanded]="!sidebarCollapsed"
          [attr.aria-label]="!sidebarCollapsed ? 'Colapsar menú lateral' : 'Expandir sidebar'"
        >
          <svg
            class="toggle-icon"
            stroke="currentColor"
            fill="currentColor"
            stroke-width="0"
            viewBox="0 0 320 512"
            width="12"
            height="12"
            xmlns="http://www.w3.org/2000/svg"
            [style.transform]="sidebarCollapsed ? 'rotate(0deg)' : 'rotate(180deg)'"
          >
            <path d="M285.476 272.971L91.132 467.314c-9.373 9.373-24.569 9.373-33.941 0l-22.667-22.667c-9.357-9.357-9.375-24.522-.04-33.901L188.505 256 34.484 101.255c-9.335-9.379-9.317-24.544.04-33.901l22.667-22.667c9.373-9.373 24.569-9.373 33.941 0L285.475 239.03c9.373 9.372 9.373 24.568.001 33.941z"></path>
          </svg>
        </button>
        <span class="toggle-tooltip" aria-hidden="true">{{ !sidebarCollapsed ? 'Colapsar menú lateral' : 'Expandir sidebar' }}</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-btn" (click)="toggleTheme()" [attr.aria-pressed]="isDark()" title="Alternar tema">
        <svg *ngIf="isDark()" class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg *ngIf="!isDark()" class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor" />
          <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.2" y1="4.2" x2="5.6" y2="5.6" />
            <line x1="18.4" y1="18.4" x2="19.8" y2="19.8" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.2" y1="19.8" x2="5.6" y2="18.4" />
            <line x1="18.4" y1="5.6" x2="19.8" y2="4.2" />
          </g>
        </svg>
      </button>
    </div>
  </aside>

  <div class="content-area">
    <header class="topbar" *ngIf="showTopbar">
      <div class="topbar-left">
        <button class="mobile-hamburger" [class.open]="sidebarOpen" *ngIf="showSidebar" (click)="isDesktop() ? onToggleButtonClick($event) : toggleSidebarOverlay()" [attr.aria-label]="sidebarOpen ? 'Cerrar menú lateral' : 'Abrir menú lateral'" [attr.aria-expanded]="sidebarOpen">
          <ng-container *ngIf="!sidebarOpen; else closeIcon">
            <svg class="icon-burger" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
              <path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"></path>
            </svg>
          </ng-container>
          <ng-template #closeIcon>
            <svg class="icon-close" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="2">
              <line class="l1" x1="6" y1="6" x2="18" y2="18" stroke-linecap="round" />
              <line class="l2" x1="6" y1="18" x2="18" y2="6" stroke-linecap="round" />
            </svg>
          </ng-template>
        </button>
      </div>
      <div class="user-menu" [class.menu-open]="showUserMenu">
        <div class="user-pill" (click)="toggleUserMenu()" role="button" tabindex="0" (keydown.enter)="toggleUserMenu()" (keydown.space)="toggleUserMenu()">
          <span class="avatar"> <img *ngIf="currentProfile?.fotoPerfil; else avatarInitial" [src]="currentProfile?.fotoPerfil" alt="" /><ng-template #avatarInitial>{{ username.charAt(0).toUpperCase() }}</ng-template></span>
          <span>{{ username }}</span>
          <span class="user-menu-arrow">▾</span>
        </div>
        <div class="user-menu-dropdown" *ngIf="showUserMenu">
          <a class="profile-menu-btn" routerLink="/perfil" (click)="closeUserMenu()">Perfil</a>
          <button type="button" class="logout-btn" (click)="logout()">Cerrar sesión</button>
        </div>
      </div>
      <button class="user-menu-backdrop" *ngIf="showUserMenu" type="button" aria-label="Cerrar menú de usuario" (click)="closeUserMenu()"></button>
    </header>

    <main class="main-content" [class.public-page]="!showTopbar">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Backdrop for mobile drawer -->
<div class="backdrop" *ngIf="sidebarOpen" (click)="closeSidebarOverlay()" aria-hidden="true"></div>
</div>
