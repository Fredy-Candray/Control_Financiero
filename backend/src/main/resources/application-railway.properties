# Isolated trial deployment. Activate only with SPRING_PROFILES_ACTIVE=railway.
# PostgreSQL variables must reference the NEW database in the Railway project.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.origins=https://${RAILWAY_PUBLIC_DOMAIN:localhost}
app.password-reset.frontend-url=https://${RAILWAY_PUBLIC_DOMAIN:localhost}/reset-password
# Trial only: never import real mail, tokens, bank mappings, or mail credentials.
app.gmail.client-id=
app.gmail.client-secret=
app.gmail.encryption-key=
app.pay.user-id=0
app.pay.extended=false
spring.mail.host=
spring.mail.username=
spring.mail.password=
app.whatsapp.access-token=
