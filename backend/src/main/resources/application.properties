spring.application.name=control-financiero
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:sqlserver://localhost:63646;databaseName=ControlFinanciero;encrypt=true;trustServerCertificate=true
spring.datasource.username=control_financiero
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

server.port=8081

# Configure mail credentials as environment variables; no secrets belong in this file.
spring.mail.host=${CONTROL_FINANCIERO_MAIL_HOST:${MAIL_HOST:}}
spring.mail.port=${CONTROL_FINANCIERO_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${CONTROL_FINANCIERO_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${CONTROL_FINANCIERO_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.notifications.email-from=${CONTROL_FINANCIERO_MAIL_FROM:${MAIL_FROM:}}
app.password-reset.frontend-url=${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
app.notifications.poll-ms=${NOTIFICATION_POLL_MS:60000}
app.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.template=${WHATSAPP_TEMPLATE:calendar_reminder}
app.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:es}

# Gmail BAC: secrets must be supplied outside source control.
app.gmail.client-id=${GMAIL_CLIENT_ID:}
app.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
app.gmail.encryption-key=${GMAIL_ENCRYPTION_KEY:}
app.gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8081/api/gmail-bac/callback}
app.gmail.frontend-url=${GMAIL_FRONTEND_URL:http://localhost:4200/cuentas}
app.gmail.poll-ms=${GMAIL_POLL_MS:60000}
app.gmail.events-since=${GMAIL_EVENTS_SINCE:}
app.pay.user-id=${PAY_USER_ID:0}
app.pay.extended=${PAY_EXTENDED:false}
app.pay.owner-name=${PAY_OWNER_NAME:}
app.pay.import-since=${PAY_IMPORT_SINCE:}
app.pay.destination-last-four=${PAY_DESTINATION_LAST_FOUR:}
app.pay.origin-name=${PAY_ORIGIN_NAME:Pay}
app.pay.destination-name=${PAY_DESTINATION_NAME:Tarjeta d\u00e9bito}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.use2.devtunnels.ms}
