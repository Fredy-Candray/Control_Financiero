# Enable AFTER the security checks and verified migration, together with railway.
# SPRING_PROFILES_ACTIVE=railway,cloud. Trial data remains in the public schema.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:cofi_live}
spring.jpa.hibernate.ddl-auto=${DB_DDL_MODE:validate}
spring.datasource.hikari.schema=${DB_SCHEMA:cofi_live}
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require
app.registration.enabled=false
app.cloud.maintenance=${COFI_MAINTENANCE:true}
app.gmail.import-enabled=${GMAIL_IMPORT_ENABLED:false}
app.gmail.client-id=${GMAIL_CLIENT_ID:}
app.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
app.gmail.encryption-key=${GMAIL_ENCRYPTION_KEY:}
app.gmail.card-aliases=${GMAIL_CARD_ALIASES:}
app.gmail.redirect-uri=https://${RAILWAY_PUBLIC_DOMAIN}/api/gmail-bac/callback
app.gmail.frontend-url=https://${RAILWAY_PUBLIC_DOMAIN}/cuentas
app.pay.user-id=${PAY_USER_ID:0}
app.pay.extended=${PAY_EXTENDED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.notifications.email-from=${MAIL_FROM:}
app.email.provider=${MAIL_PROVIDER:smtp}
app.email.gmail-refresh-token=${GMAIL_SENDER_REFRESH_TOKEN:}
logging.level.org.springframework.boot.autoconfigure.security=ERROR
